name: Publish Wiki

on:
  push:
    branches:
      - develop
    paths:
      - "wiki/**"

  workflow_dispatch:

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v6

      - name: Clone wiki repository
        run: |
          git clone \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git \
            wiki-repo

      - name: Sync wiki content
        run: |
          # Copy all markdown files from wiki/ into the wiki repo root
          cp -r wiki/. wiki-repo/

      - name: Commit and push to wiki
        run: |
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          # Exit cleanly if there is nothing to commit
          git diff --cached --quiet && echo "No changes to publish" && exit 0
          git commit -m "Sync wiki from source [skip ci]

          Source commit: ${{ github.sha }}
          Triggered by: ${{ github.actor }}"
          git push
